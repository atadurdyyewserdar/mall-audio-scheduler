[project]
name = "mall-audio-scheduler"
version = "0.1.0"
description = "Offline, unattended background music and announcement scheduling."
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "numpy>=2.0,<3", "mutagen>=1.47,<2", "qtawesome>=1.4,<2"]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]

[project.scripts]
mall-audio = "mall_audio.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mall_audio*"]
